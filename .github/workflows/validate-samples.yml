name: Validate starter recipes

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    name: Hermetic source-preservation and publication tests
    runs-on: windows-2025
    timeout-minutes: 10
    defaults:
      run:
        shell: powershell
    steps:
      - name: Check out recipe and candidate pins
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Check out pinned compatible CLI for input validation
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: HasinthaAttanayake/NEMSweep
          ref: 766316fbe1ce8bc965d2ed38e5500aa1f8c761e0
          path: .repro-check-cli
          persist-credentials: false

      - name: Build compatible CLI
        run: |
          dotnet build .\.repro-check-cli\NEMSweep.CLI\NEMSweep.CLI.csproj -c Release
          if ($LASTEXITCODE -ne 0) { throw 'Compatible CLI build failed.' }

      - name: Verify pinned toolchain family
        run: |
          $ErrorActionPreference = 'Stop'
          if ($PSVersionTable.PSEdition -ne 'Desktop' -or
              $PSVersionTable.PSVersion.Major -ne 5 -or
              $PSVersionTable.PSVersion.Minor -ne 1) {
              throw 'Windows PowerShell 5.1 is required; do not use pwsh.'
          }
          $framework = Get-ItemProperty 'HKLM:\SOFTWARE\Microsoft\NET Framework Setup\NDP\v4\Full'
          if ($framework.Release -lt 533320 -or $framework.Version -notlike '4.8.*') {
              throw '.NET Framework 4.8.1 is required.'
          }
          Write-Host "PowerShell $($PSVersionTable.PSVersion); .NET Framework $($framework.Version), release $($framework.Release)"

      - name: Test fixture packaging and publication refusals offline
        env:
          GH_TOKEN: ''
          GITHUB_TOKEN: ''
        run: |
          $ErrorActionPreference = 'Stop'
          .\scripts\Test-Samples.ps1 -VerificationDirectory .\.repro-check `
            -CliAssemblyPath (Resolve-Path .\.repro-check-cli\NEMSweep.CLI\bin\Release\net10.0\nemsweep.dll).Path
          if (Test-Path -LiteralPath .\.repro-check) {
              throw 'The verification directory was not cleaned up.'
          }
          Remove-Item -LiteralPath .\.repro-check-cli -Recurse -Force
          $changes = @(git status --porcelain --untracked-files=all)
          if ($LASTEXITCODE -ne 0) { throw 'git status failed.' }
          if ($changes.Count -ne 0) {
              throw "Tests changed the checkout: $($changes -join '; ')"
          }
